name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: FAKE0704
          outputs: |
            dist/snake.svg?palette=github-dark

      # Keep the SVG inside this repo and reference it with a relative path,
      # so the animation loads from GitHub itself instead of an external image host.
      - name: Commit snake SVG to main
        run: |
          cp dist/snake.svg snake.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake.svg
          git diff --cached --quiet || git commit -m "chore: update contribution snake [skip ci]"
          git push

      - name: Push to output branch (legacy reference)
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
